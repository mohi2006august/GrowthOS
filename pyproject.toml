[project]
name = "growthos"
version = "0.1.0"
description = "Autonomous growth-experiment agent with CAC and burn guardrails and human approval on every spend."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "mohi2006august", email = "nizamuddinnumaan822@gmail.com" }]
dependencies = [
    "anthropic>=0.80",
    "cvxpy>=1.6",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=1.9",
    "numpy>=2.1",
    "pydantic>=2.9",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# Heavy training stack, only needed to train the brand-voice adapter (FR-06).
lora = ["datasets>=3.0", "peft>=0.13", "torch>=2.4", "transformers>=4.46"]

[project.scripts]
growthos = "growthos.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["growthos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: statistical validation that simulates many experiments"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
